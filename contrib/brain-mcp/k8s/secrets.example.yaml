# DO NOT COMMIT REAL VALUES. Copy to secrets.yaml, fill in, apply, and keep
# secrets.yaml out of git (it is covered by .gitignore in this directory).
#
# Generate the values on neuron:
#
#   JWT secret (32 random bytes, base64):
#     head -c 32 /dev/urandom | base64
#
#   Vault password (this is what you type on the consent screen):
#     head -c 18 /dev/urandom | base64
#
# Verify a secret landed correctly without echoing it:
#     kubectl -n brain get secret brain-mcp -o jsonpath='{.data.jwt-secret}' \
#       | base64 -d | wc -c        # expect 44 for a base64'd 32-byte value
#     kubectl -n brain get secret brain-mcp -o jsonpath='{.data.jwt-secret}' \
#       | base64 -d | sha256sum | cut -c1-12
---
apiVersion: v1
kind: Secret
metadata:
  name: brain-mcp
  namespace: brain
type: Opaque
stringData:
  jwt-secret: "REPLACE_ME_base64_32_random_bytes"
  auth-password: "REPLACE_ME_vault_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared
  namespace: brain
type: Opaque
stringData:
  # From the Cloudflare Zero Trust dashboard when you create the tunnel:
  # Networks -> Tunnels -> Create -> the `--token ey...` value.
  tunnel-token: "REPLACE_ME_cloudflare_tunnel_token"
